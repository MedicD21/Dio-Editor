version: "3.9"

networks:
  dio-network:
    driver: bridge

volumes:
  temp_media:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=dio_editor
      - POSTGRES_USER=dio
      - POSTGRES_PASSWORD=dio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dio -d dio_editor"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dio-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dio:dio@postgres:5432/dio_editor
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - temp_media:/tmp/dio
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dio-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dio:dio@postgres:5432/dio_editor
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - temp_media:/tmp/dio
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dio-network
    command: celery -A tasks.render_task worker --loglevel=info --concurrency=2

  remotion:
    build:
      context: ./remotion-renderer
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - temp_media:/tmp/dio
    networks:
      - dio-network
    environment:
      - PORT=3001
      - TEMP_DIR=/tmp/dio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - dio-network
    command: npm run dev
